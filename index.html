<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrenador d'Acords</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

    :root {
      --bg-dark: #1C2135;
      --card-bg: #2C344F;
      --primary-text: #FFFFFF;
      --secondary-text: #A9B1D6;
      --accent-pink: #E04463;
      --accent-green: #89d489;
      --input-border: #414868;
    }

    body {
      font-family: 'Inter', Arial, sans-serif;
      text-align: center;
      margin: 0;
      background-color: var(--bg-dark);
      color: var(--secondary-text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
      box-sizing: border-box;
    }

    .container {
      background-color: var(--card-bg);
      padding: 25px;
      border-radius: 20px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
    
    h1 {
      font-size: 1.2em;
      color: var(--primary-text);
      font-weight: 700;
      margin: 0 0 20px 0;
    }

    .top-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      font-size: 0.9em;
    }

    #acordPregunta {
      font-size: 2.5em;
      font-weight: 900;
      color: var(--primary-text);
      margin: 0 0 15px 0;
    }

    #resultat {
      font-weight: bold;
      font-size: 1.1em;
      min-height: 50px;
      line-height: 1.4;
      margin-bottom: 15px;
    }
    
    .resposta-correcta-error {
        color: var(--accent-green);
        font-size: 1.2em;
        display: block;
        margin-top: 4px;
    }

    input {
      padding: 15px;
      width: 100%;
      font-size: 1.3em;
      margin-bottom: 20px;
      box-sizing: border-box;
      background-color: var(--bg-dark);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      color: var(--primary-text);
      text-align: center;
      letter-spacing: 3px;
      font-weight: bold;
    }

    /* TECLAT ORGANITZAT PER FILES */
    .teclat-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 25px;
    }

    .fila-notes {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .fila-accions {
      display: grid;
      grid-template-columns: 0.8fr 0.8fr 1.2fr 1.2fr;
      gap: 10px;
    }

    .btn-teclat {
      background-color: #414868;
      color: white;
      border: none;
      padding: 12px 2px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95em;
      transition: background 0.1s, transform 0.1s;
    }

    .fila-notes .btn-teclat {
      font-size: 0.85em; /* Una mica més petit perquè càpiguen els 7 */
    }

    .btn-mod { background-color: #565f89; font-size: 1.2em; }
    .btn-del { background-color: #3b4261; }
    .btn-ok { background-color: var(--accent-green); color: #1c2135; }

    .btn-teclat:active { transform: scale(0.92); filter: brightness(1.2); }

    button#btnSeguent {
      display: block;
      width: 100%;
      padding: 18px 0;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      border: none;
      background-color: var(--accent-pink);
      color: var(--primary-text);
      border-radius: 10px;
    }

    button:disabled {
      background-color: #5b6079;
      color: #9a9fb5;
      cursor: not-allowed;
    }

    audio { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎹 Entrenador d'Acords</h1>

    <div class="top-info">
        <p id="punts">Punts: 0</p>
        <p id="temps">Temps: -</p>
    </div>

    <p id="acordPregunta">Carregant...</p>
    <div id="resultat"></div>

    <input type="text" id="resposta" placeholder="---" readonly />

    <div class="teclat-container">
      <div class="fila-notes">
        <button class="btn-teclat" onclick="premerNota('C')">Do</button>
        <button class="btn-teclat" onclick="premerNota('D')">Re</button>
        <button class="btn-teclat" onclick="premerNota('E')">Mi</button>
        <button class="btn-teclat" onclick="premerNota('F')">Fa</button>
        <button class="btn-teclat" onclick="premerNota('G')">Sol</button>
        <button class="btn-teclat" onclick="premerNota('A')">La</button>
        <button class="btn-teclat" onclick="premerNota('B')">Si</button>
      </div>

      <div class="fila-accions">
        <button class="btn-teclat btn-mod" onclick="premerMod('#')">#</button>
        <button class="btn-teclat btn-mod" onclick="premerMod('b')">b</button>
        <button class="btn-teclat btn-del" onclick="esborrar()">Esborrar</button>
        <button class="btn-teclat btn-ok" onclick="comprovar()">OK</button>
      </div>
    </div>

    <button id="btnSeguent" disabled>Següent Acord</button>
    <p id="resum"></p>
  </div>

  <audio id="soCorrecte" src="sounds/correcte.mp3" preload="auto"></audio>
  <audio id="soError" src="sounds/error.mp3" preload="auto"></audio>
  <audio id="soBenvinguda" src="sounds/benvinguda.mp3" preload="auto"></audio>

  <script>
    const acordsPerNivell = {
      facil: { "C": ["C", "E", "G"], "D": ["D", "F#", "A"], "E": ["E", "G#", "B"], "F": ["F", "A", "C"], "G": ["G", "B", "D"], "A": ["A", "C#", "E"], "B": ["B", "D#", "F#"], "Cm": ["C", "Eb", "G"], "Dm": ["D", "F", "A"], "Em": ["E", "G", "B"], "Fm": ["F", "Ab", "C"], "Gm": ["G", "Bb", "D"], "Am": ["A", "C", "E"], "Bm": ["B", "D", "F#"] },
      mitja: { "F#": ["F#", "A#", "C#"], "Bb": ["Bb", "D", "F"], "Eb": ["Eb", "G", "Bb"], "Ab": ["Ab", "C", "Eb"], "Db": ["Db", "F", "Ab"], "Bbm": ["Bb", "Db", "F"], "Ebm": ["Eb", "Gb", "Bb"], "F#m": ["F#", "A", "C#"], "Abm": ["Ab", "Cb", "Eb"] },
      dificil: { "G#m": ["G#", "B", "D#"], "G#": ["G#", "B#", "D#"],"C#m": ["C#", "E", "G#"], "A#m": ["A#", "C#", "E#"], "Dbm": ["Db", "Fb", "Ab"], "Cb": ["Cb", "Eb", "Gb"], "A#": ["A#", "C##", "E#"], "C#": ["C#", "E#", "G#"], "D#m": ["D#", "F#", "A#"], "Gb": ["Gb", "Bb", "Db"] }
    };

    let nivellActualJoc = 'facil', puntsNivellFacil = 0, puntsNivellMitja = 0;
    let acordActual = "", notesActuals = [], punts = 0, totalRespostes = 0;
    const tempsMaxim = 15;
    let temps = tempsMaxim, intervalId = null, respostaJaComprovada = false, acordsMostratsGlobal = [];
    let llistaNotesEntrades = [];

    const btnSeguent = document.getElementById("btnSeguent");
    const inputResposta = document.getElementById("resposta");
    const resultatEl = document.getElementById("resultat");

    function premerNota(nota) {
      if (respostaJaComprovada || llistaNotesEntrades.length >= 3) return;
      llistaNotesEntrades.push(nota);
      actualitzarInput();
    }

    function premerMod(mod) {
      if (respostaJaComprovada || llistaNotesEntrades.length === 0) return;
      let ultimaIdx = llistaNotesEntrades.length - 1;
      if (!llistaNotesEntrades[ultimaIdx].includes('#') && !llistaNotesEntrades[ultimaIdx].includes('b')) {
        llistaNotesEntrades[ultimaIdx] += mod;
        actualitzarInput();
      }
    }

    function esborrar() {
      if (respostaJaComprovada) return;
      llistaNotesEntrades.pop();
      actualitzarInput();
    }

    function actualitzarInput() {
      inputResposta.value = llistaNotesEntrades.join(" ");
    }

    function nouAcord() {
      if (totalRespostes >= 10) { bloquejarSiAcabat(); return; }
      
      const acords = (nivellActualJoc === 'facil') ? acordsPerNivell.facil : (nivellActualJoc === 'mitja' ? acordsPerNivell.mitja : acordsPerNivell.dificil);
      let noms = Object.keys(acords).filter(n => !acordsMostratsGlobal.includes(n));
      if (noms.length === 0) { acordsMostratsGlobal = []; noms = Object.keys(acords); }

      acordActual = noms[Math.floor(Math.random() * noms.length)];
      notesActuals = acords[acordActual];
      acordsMostratsGlobal.push(acordActual);
      
      document.getElementById("acordPregunta").textContent = `Acord de ${acordActual}`;
      resultatEl.innerHTML = "";
      inputResposta.value = "";
      llistaNotesEntrades = [];
      temps = tempsMaxim;
      document.getElementById("temps").textContent = `Temps: ${temps}s`;
      
      if (intervalId) clearInterval(intervalId);
      intervalId = setInterval(actualitzarTemps, 1000);
      respostaJaComprovada = false;
      btnSeguent.disabled = true;
    }

    function actualitzarTemps() {
      temps--;
      document.getElementById("temps").textContent = `Temps: ${temps}s`;
      if (temps <= 0) {
        clearInterval(intervalId);
        if (!respostaJaComprovada) {
          document.getElementById("soError").play();
          mostrarResultat(false, `Temps esgotat!<br><span class="resposta-correcta-error">${notesActuals.join(" ")}</span>`);
          totalRespostes++;
          respostaJaComprovada = true;
          btnSeguent.disabled = false;
          bloquejarSiAcabat();
        }
      }
    }

    function comprovar() {
      if (respostaJaComprovada || temps <= 0 || llistaNotesEntrades.length === 0) return;
      
      const resp = llistaNotesEntrades.map(n => n.toUpperCase()).sort().join(",");
      const corr = [...notesActuals].map(n => n.toUpperCase()).sort().join(",");

      clearInterval(intervalId);
      totalRespostes++;
      respostaJaComprovada = true;

      if (resp === corr) {
        punts++;
        document.getElementById("soCorrecte").play();
        let msg = "Correcte!";
        if (nivellActualJoc === 'facil' && ++puntsNivellFacil === 4) { nivellActualJoc = 'mitja'; msg = "Correcte! 🎉 Nivell Mitjà!"; }
        else if (nivellActualJoc === 'mitja' && ++puntsNivellMitja === 4) { nivellActualJoc = 'dificil'; msg = "Correcte! 🔥 Nivell Difícil!"; }
        mostrarResultat(true, msg);
      } else {
        document.getElementById("soError").play();
        mostrarResultat(false, `Incorrecte.<br><span class="resposta-correcta-error">${notesActuals.join(" ")}</span>`);
      }
      
      document.getElementById("punts").textContent = `Punts: ${punts}`;
      btnSeguent.disabled = false;
      bloquejarSiAcabat();
    }

    function mostrarResultat(correcte, msg) {
      resultatEl.innerHTML = msg;
      resultatEl.style.color = correcte ? "var(--accent-green)" : "var(--accent-pink)";
    }

    function bloquejarSiAcabat() {
      if (totalRespostes >= 10) {
        document.getElementById("resum").textContent = `Test acabat! Has fet ${punts} punts de 10.`;
        btnSeguent.disabled = true;
        clearInterval(intervalId);
        document.getElementById("temps").textContent = "Fi";
      }
    }

    btnSeguent.addEventListener("click", nouAcord);
    window.onload = () => { nouAcord(); };
  </script>
</body>
</html>
