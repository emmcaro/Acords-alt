<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrenador d'Acords (Veu)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

    :root {
      --bg-dark: #1C2135;
      --card-bg: #2C344F;
      --primary-text: #FFFFFF;
      --secondary-text: #A9B1D6;
      --accent-pink: #E04463;
      --accent-green: #89d489;
      --input-border: #414868;
    }

    body {
      font-family: 'Inter', Arial, sans-serif;
      text-align: center;
      margin: 0;
      background-color: var(--bg-dark);
      color: var(--secondary-text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
    
    h1 {
      font-size: 1.3em;
      color: var(--primary-text);
      font-weight: 700;
      margin: 0 0 25px 0;
    }

    .top-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      font-size: 0.9em;
    }

    #acordPregunta {
      font-size: 2.5em;
      font-weight: 900;
      color: var(--primary-text);
      margin: 0 0 25px 0;
    }

    #resultat {
      font-weight: bold;
      font-size: 1.1em;
      min-height: 50px;
      line-height: 1.4;
      color: var(--accent-pink);
      margin-bottom: 25px;
    }
    
    .resposta-correcta-error {
        color: var(--accent-green);
        font-size: 1.2em;
        display: inline-block;
        margin-top: 6px;
    }

    input {
      padding: 18px;
      width: 100%;
      font-size: 1.1em;
      margin-bottom: 10px;
      box-sizing: border-box;
      background-color: var(--bg-dark);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      color: var(--primary-text);
      text-align: center;
    }

    /* Botó de veu */
    #btnVeu {
      background-color: #414868;
      margin-bottom: 20px;
      font-size: 0.9em;
    }
    #btnVeu.escoltant {
      background-color: var(--accent-green);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    button {
      display: block;
      width: 100%;
      margin: 10px auto;
      padding: 18px 0;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      border: none;
      background-color: var(--accent-pink);
      color: var(--primary-text);
      border-radius: 10px;
      transition: filter 0.2s;
    }
    
    button:hover:not(:disabled) {
        filter: brightness(1.1);
    }

    button:disabled {
      background-color: #5b6079;
      color: #9a9fb5;
      cursor: not-allowed;
    }

    audio { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎹 Digues les notes de l'acord</h1>

    <div class="top-info">
        <p id="punts">Punts: 0</p>
        <p id="temps">Temps: -</p>
    </div>

    <p id="acordPregunta">Carregant...</p>
    <p id="resultat"></p>

    <input type="text" id="resposta" placeholder="C E G o digues 'Do Mi Sol'" autocomplete="off" />
    
    <button id="btnVeu">🎤 Clica per parlar</button>
    <button id="btnSeguent" disabled>Següent Acord</button>

    <p id="resum"></p>
  </div>

  <audio id="soCorrecte" src="sounds/correcte.mp3" preload="auto"></audio>
  <audio id="soError" src="sounds/error.mp3" preload="auto"></audio>
  <audio id="soBenvinguda" src="sounds/benvinguda.mp3" preload="auto"></audio>

  <script>
    const acordsPerNivell = {
      facil: { "C": ["C", "E", "G"], "D": ["D", "F#", "A"], "E": ["E", "G#", "B"], "F": ["F", "A", "C"], "G": ["G", "B", "D"], "A": ["A", "C#", "E"], "B": ["B", "D#", "F#"], "Cm": ["C", "Eb", "G"], "Dm": ["D", "F", "A"], "Em": ["E", "G", "B"], "Fm": ["F", "Ab", "C"], "Gm": ["G", "Bb", "D"], "Am": ["A", "C", "E"], "Bm": ["B", "D", "F#"] },
      mitja: { "F#": ["F#", "A#", "C#"], "Bb": ["Bb", "D", "F"], "Eb": ["Eb", "G", "Bb"], "Ab": ["Ab", "C", "Eb"], "Db": ["Db", "F", "Ab"], "Bbm": ["Bb", "Db", "F"], "Ebm": ["Eb", "Gb", "Bb"], "F#m": ["F#", "A", "C#"], "Abm": ["Ab", "Cb", "Eb"] },
      dificil: { "G#m": ["G#", "B", "D#"], "G#": ["G#", "B#", "D#"],"C#m": ["C#", "E", "G#"], "A#m": ["A#", "C#", "E#"], "Dbm": ["Db", "Fb", "Ab"], "Cb": ["Cb", "Eb", "Gb"], "A#": ["A#", "C##", "E#"], "C#": ["C#", "E#", "G#"], "D#m": ["D#", "F#", "A#"], "Gb": ["Gb", "Bb", "Db"] }
    };

    // Diccionari per traduir veu a notació internacional
    const diccionariNotes = {
      'do': 'C', 're': 'D', 'mi': 'E', 'fa': 'F', 'sol': 'G', 'la': 'A', 'si': 'B',
      'sostingut': '#', 'diesi': '#', 'bemoll': 'b', 'bemol': 'b'
    };

    let nivellActualJoc = 'facil', puntsNivellFacil = 0, puntsNivellMitja = 0;
    let acordsActuals = {}, acordActual = "", notesActuals = [], punts = 0, totalRespostes = 0;
    const tempsMaxim = 15;
    let temps = tempsMaxim, intervalId = null, respostaJaComprovada = false, acordsMostratsGlobal = [];

    const btnSeguent = document.getElementById("btnSeguent");
    const btnVeu = document.getElementById("btnVeu");
    const inputResposta = document.getElementById("resposta");
    const acordPreguntaEl = document.getElementById("acordPregunta");
    const resultatEl = document.getElementById("resultat");
    const puntsEl = document.getElementById("punts");
    const tempsEl = document.getElementById("temps");
    const resumEl = document.getElementById("resum");
    const soCorrecte = document.getElementById("soCorrecte"), soError = document.getElementById("soError"), soBenvinguda = document.getElementById("soBenvinguda");

    // CONFIGURACIÓ RECONEIXEMENT DE VEU
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ca-ES'; 
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => { btnVeu.textContent = "Escoltant..."; btnVeu.classList.add("escoltant"); };
      recognition.onend = () => { btnVeu.textContent = "🎤 Clica per parlar"; btnVeu.classList.remove("escoltant"); };
      
      recognition.onresult = (event) => {
        const textEscoltat = event.results[0][0].transcript.toLowerCase();
        inputResposta.value = traduirVeuANotes(textEscoltat);
        comprovar();
      };
    }

    function traduirVeuANotes(veu) {
      // Netegem el text de paraules sobreres
      let paraules = veu.replace(/ i /g, " ").split(/\s+/);
      let notesResultat = [];
      let notaAcumulada = "";

      paraules.forEach(p => {
        if (diccionariNotes[p]) {
          let valor = diccionariNotes[p];
          if (valor === '#' || valor === 'b') {
            if (notesResultat.length > 0) {
              notesResultat[notesResultat.length - 1] += valor;
            }
          } else {
            notesResultat.push(valor);
          }
        }
      });
      return notesResultat.join(" ");
    }

    function obtenirAcordsNivellActual() {
      if (nivellActualJoc === 'facil') return acordsPerNivell.facil;
      if (nivellActualJoc === 'mitja') return acordsPerNivell.mitja;
      return acordsPerNivell.dificil;
    }

    function nouAcord() {
      if (totalRespostes >= 10) { bloquejarSiAcabat(); return; }
      acordsActuals = obtenirAcordsNivellActual();
      const nomsAcordsDisponibles = Object.keys(acordsActuals).filter(nom => !acordsMostratsGlobal.includes(nom));
      if (nomsAcordsDisponibles.length === 0) {
        acordsMostratsGlobal = acordsMostratsGlobal.filter(nom => !Object.keys(acordsActuals).includes(nom));
        nouAcord(); return;
      }
      acordActual = nomsAcordsDisponibles[Math.floor(Math.random() * nomsAcordsDisponibles.length)];
      notesActuals = acordsActuals[acordActual];
      acordsMostratsGlobal.push(acordActual);
      acordPreguntaEl.textContent = `Acord de ${acordActual}`;
      resultatEl.innerHTML = "";
      inputResposta.value = "";
      temps = tempsMaxim;
      tempsEl.textContent = `Temps: ${temps}s`;
      if (intervalId) clearInterval(intervalId);
      intervalId = setInterval(actualitzarTemps, 1000);
      respostaJaComprovada = false;
      btnSeguent.disabled = true;
      inputResposta.disabled = false;
      inputResposta.focus();
    }

    function actualitzarTemps() {
      temps--;
      tempsEl.textContent = `Temps: ${temps}s`;
      if (temps <= 0) {
        clearInterval(intervalId);
        if (!respostaJaComprovada) {
          soError.play();
          mostrarResultat(false, `Temps esgotat!<br><span class="resposta-correcta-error">${notesActuals.join(" ")}</span>`);
          totalRespostes++;
          respostaJaComprovada = true;
          btnSeguent.disabled = false;
          bloquejarSiAcabat();
        }
      }
    }

    function netejarNotes(notesArray) {
      return notesArray.map(n => n.trim().toUpperCase()).sort();
    }

    function comprovar() {
      if (respostaJaComprovada || temps <= 0) return;
      const resposta = inputResposta.value.trim().split(/\s+/);
      if (resposta.length !== 3 && resposta[0] !== '') {
        mostrarResultat(false, "S'esperen 3 notes.");
        return;
      } else if (resposta[0] === '') return;

      const respostaNeta = netejarNotes(resposta);
      const correcteNeta = netejarNotes(notesActuals);
      clearInterval(intervalId);
      totalRespostes++;
      respostaJaComprovada = true;

      if (JSON.stringify(respostaNeta) === JSON.stringify(correcteNeta)) {
        punts++;
        soCorrecte.play();
        let msg = "Correcte!";
        if (nivellActualJoc === 'facil' && ++puntsNivellFacil === 4) { nivellActualJoc = 'mitja'; msg = "Correcte! 🎉 Nivell Mitjà!"; }
        else if (nivellActualJoc === 'mitja' && ++puntsNivellMitja === 4) { nivellActualJoc = 'dificil'; msg = "Correcte! 🔥 Nivell Difícil!"; }
        mostrarResultat(true, msg);
      } else {
        soError.play();
        mostrarResultat(false, `Incorrecte.<br><span class="resposta-correcta-error">${notesActuals.join(" ")}</span>`);
      }
      puntsEl.textContent = `Punts: ${punts}`;
      btnSeguent.disabled = false;
      bloquejarSiAcabat();
    }

    function mostrarResultat(correcte, missatge) {
      resultatEl.innerHTML = missatge;
      resultatEl.style.color = correcte ? "var(--accent-green)" : "var(--accent-pink)";
    }

    function bloquejarSiAcabat() {
      if (totalRespostes >= 10) {
        resumEl.textContent = `Test acabat! Punts: ${punts}/10.`;
        btnSeguent.disabled = true;
        inputResposta.disabled = true;
        btnVeu.disabled = true;
        if(intervalId) clearInterval(intervalId);
        tempsEl.textContent = "Fi";
      }
    }

    btnSeguent.addEventListener("click", nouAcord);
    btnVeu.addEventListener("click", () => { if(recognition) recognition.start(); });
    inputResposta.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); comprovar(); } });

    window.onload = () => { soBenvinguda.play().catch(() => {}); nouAcord(); };
  </script>
</body>
</html>
