<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrenador d'Acords</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

    :root {
      --bg-dark: #1C2135;
      --card-bg: #2C344F;
      --primary-text: #FFFFFF;
      --secondary-text: #A9B1D6;
      --accent-pink: #E04463;
      --accent-green: #89d489;
      --input-border: #414868;
    }

    body {
      font-family: 'Inter', Arial, sans-serif;
      text-align: center;
      margin: 0;
      background-color: var(--bg-dark);
      color: var(--secondary-text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
    
    h1 {
      font-size: 1.3em;
      color: var(--primary-text);
      font-weight: 700;
      margin: 0 0 25px 0;
    }

    .top-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 0.9em;
    }

    #acordPregunta {
      font-size: 2.5em;
      font-weight: 900;
      color: var(--primary-text);
      margin: 0 0 20px 0;
    }

    #resultat {
      font-weight: bold;
      font-size: 1.1em;
      min-height: 50px;
      line-height: 1.4;
      color: var(--accent-pink);
      margin-bottom: 15px;
    }
    
    .resposta-correcta-error {
        color: var(--accent-green);
        font-size: 1.2em;
        display: inline-block;
        margin-top: 6px;
    }

    input {
      padding: 15px;
      width: 100%;
      font-size: 1.2em;
      margin-bottom: 20px;
      box-sizing: border-box;
      background-color: var(--bg-dark);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      color: var(--primary-text);
      text-align: center;
      letter-spacing: 2px;
    }

    /* CONTENIDOR DE BOTONS */
    .teclat {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn-nota {
      background-color: #414868;
      color: white;
      border: none;
      padding: 15px 5px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1em;
      transition: background 0.2s;
    }

    .btn-nota:active { transform: scale(0.95); }

    .btn-modificador { background-color: #565f89; }
    .btn-esborrar { background-color: #3b4261; grid-column: span 2; }

    button#btnSeguent {
      display: block;
      width: 100%;
      padding: 18px 0;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      border: none;
      background-color: var(--accent-pink);
      color: var(--primary-text);
      border-radius: 10px;
    }

    button:disabled {
      background-color: #5b6079;
      color: #9a9fb5;
      cursor: not-allowed;
    }

    audio { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎹 Indica les notes de l'acord</h1>

    <div class="top-info">
        <p id="punts">Punts: 0</p>
        <p id="temps">Temps: -</p>
    </div>

    <p id="acordPregunta">Carregant...</p>
    <p id="resultat"></p>

    <input type="text" id="resposta" placeholder="Notes..." readonly />

    <div class="teclat">
      <button class="btn-nota" onclick="premerNota('C', 'Do')">Do</button>
      <button class="btn-nota" onclick="premerNota('D', 'Re')">Re</button>
      <button class="btn-nota" onclick="premerNota('E', 'Mi')">Mi</button>
      <button class="btn-nota btn-modificador" onclick="premerModificador('#')">#</button>
      
      <button class="btn-nota" onclick="premerNota('F', 'Fa')">Fa</button>
      <button class="btn-nota" onclick="premerNota('G', 'Sol')">Sol</button>
      <button class="btn-nota" onclick="premerNota('A', 'La')">La</button>
      <button class="btn-nota btn-modificador" onclick="premerModificador('b')">b</button>
      
      <button class="btn-nota" onclick="premerNota('B', 'Si')">Si</button>
      <button class="btn-nota btn-esborrar" onclick="esborrarUltim()">Esborrar</button>
      <button class="btn-nota btn-modificador" style="background-color: var(--accent-green); color: #1c2135;" onclick="comprovar()">OK</button>
    </div>

    <button id="btnSeguent" disabled>Següent Acord</button>

    <p id="resum"></p>
  </div>

  <audio id="soCorrecte" src="sounds/correcte.mp3" preload="auto"></audio>
  <audio id="soError" src="sounds/error.mp3" preload="auto"></audio>
  <audio id="soBenvinguda" src="sounds/benvinguda.mp3" preload="auto"></audio>

  <script>
    const acordsPerNivell = {
      facil: { "C": ["C", "E", "G"], "D": ["D", "F#", "A"], "E": ["E", "G#", "B"], "F": ["F", "A", "C"], "G": ["G", "B", "D"], "A": ["A", "C#", "E"], "B": ["B", "D#", "F#"], "Cm": ["C", "Eb", "G"], "Dm": ["D", "F", "A"], "Em": ["E", "G", "B"], "Fm": ["F", "Ab", "C"], "Gm": ["G", "Bb", "D"], "Am": ["A", "C", "E"], "Bm": ["B", "D", "F#"] },
      mitja: { "F#": ["F#", "A#", "C#"], "Bb": ["Bb", "D", "F"], "Eb": ["Eb", "G", "Bb"], "Ab": ["Ab", "C", "Eb"], "Db": ["Db", "F", "Ab"], "Bbm": ["Bb", "Db", "F"], "Ebm": ["Eb", "Gb", "Bb"], "F#m": ["F#", "A", "C#"], "Abm": ["Ab", "Cb", "Eb"] },
      dificil: { "G#m": ["G#", "B", "D#"], "G#": ["G#", "B#", "D#"],"C#m": ["C#", "E", "G#"], "A#m": ["A#", "C#", "E#"], "Dbm": ["Db", "Fb", "Ab"], "Cb": ["Cb", "Eb", "Gb"], "A#": ["A#", "C##", "E#"], "C#": ["C#", "E#", "G#"], "D#m": ["D#", "F#", "A#"], "Gb": ["Gb", "Bb", "Db"] }
    };

    let nivellActualJoc = 'facil', puntsNivellFacil = 0, puntsNivellMitja = 0;
    let acordActual = "", notesActuals = [], punts = 0, totalRespostes = 0;
    const tempsMaxim = 15;
    let temps = tempsMaxim, intervalId = null, respostaJaComprovada = false, acordsMostratsGlobal = [];

    const btnSeguent = document.getElementById("btnSeguent");
    const inputResposta = document.getElementById("resposta");
    const acordPreguntaEl = document.getElementById("acordPregunta");
    const resultatEl = document.getElementById("resultat");
    const puntsEl = document.getElementById("punts");
    const tempsEl = document.getElementById("temps");
    const resumEl = document.getElementById("resum");

    const soCorrecte = document.getElementById("soCorrecte");
    const soError = document.getElementById("soError");
    const soBenvinguda = document.getElementById("soBenvinguda");

    // LÒGICA DELS BOTONS
    let llistaNotesEntrades = [];

    function premerNota(notaSimbol) {
      if (respostaJaComprovada || llistaNotesEntrades.length >= 3) return;
      llistaNotesEntrades.push(notaSimbol);
      actualitzarInput();
    }

    function premerModificador(mod) {
      if (respostaJaComprovada || llistaNotesEntrades.length === 0) return;
      let ultimaIndex = llistaNotesEntrades.length - 1;
      // Evitem duplicar modificadors o posar-los on no toca
      if (!llistaNotesEntrades[ultimaIndex].includes('#') && !llistaNotesEntrades[ultimaIndex].includes('b')) {
        llistaNotesEntrades[ultimaIndex] += mod;
        actualitzarInput();
      }
    }

    function esborrarUltim() {
      if (respostaJaComprovada) return;
      llistaNotesEntrades.pop();
      actualitzarInput();
    }

    function actualitzarInput() {
      inputResposta.value = llistaNotesEntrades.join(" ");
    }

    function obtenirAcordsNivellActual() {
      if (nivellActualJoc === 'facil') return acordsPerNivell.facil;
      if (nivellActualJoc === 'mitja') return acordsPerNivell.mitja;
      return acordsPerNivell.dificil;
    }

    function nouAcord() {
      if (totalRespostes >= 10) { bloquejarSiAcabat(); return; }
      const acords = obtenirAcordsNivellActual();
      const nomsDisponibles = Object.keys(acords).filter(nom => !acordsMostratsGlobal.includes(nom));
      
      if (nomsDisponibles.length === 0) {
        acordsMostratsGlobal = acordsMostratsGlobal.filter(nom => !Object.keys(acords).includes(nom));
        nouAcord(); return;
      }

      acordActual = nomsDisponibles[Math.floor(Math.random() * nomsDisponibles.length)];
      notesActuals = acords[acordActual];
      acordsMostratsGlobal.push(acordActual);
      acordPreguntaEl.textContent = `Acord de ${acordActual}`;
      resultatEl.innerHTML = "";
      inputResposta.value = "";
      llistaNotesEntrades = [];
      temps = tempsMaxim;
      tempsEl.textContent = `Temps: ${temps}s`;
      if (intervalId) clearInterval(intervalId);
      intervalId = setInterval(actualitzarTemps, 1000);
      respostaJaComprovada = false;
      btnSeguent.disabled = true;
    }

    function actualitzarTemps() {
      temps--;
      tempsEl.textContent = `Temps: ${temps}s`;
      if (temps <= 0) {
        clearInterval(intervalId);
        if (!respostaJaComprovada) {
          soError.play();
          mostrarResultat(false, `Temps esgotat!<br><span class="resposta-correcta-error">${notesActuals.join(" ")}</span>`);
          totalRespostes++;
          respostaJaComprovada = true;
          btnSeguent.disabled = false;
          bloquejarSiAcabat();
        }
      }
    }

    function netejarNotes(notesArray) {
      return notesArray.map(n => n.trim().toUpperCase()).sort();
    }

    function comprovar() {
      if (respostaJaComprovada || temps <= 0 || llistaNotesEntrades.length === 0) return;
      
      const respostaNeta = netejarNotes(llistaNotesEntrades);
      const correcteNeta = netejarNotes(notesActuals);
      
      clearInterval(intervalId);
      totalRespostes++;
      respostaJaComprovada = true;

      if (JSON.stringify(respostaNeta) === JSON.stringify(correcteNeta)) {
        punts++;
        soCorrecte.play();
        let missatge = "Correcte!";
        if (nivellActualJoc === 'facil' && ++puntsNivellFacil === 4) { nivellActualJoc = 'mitja'; missatge = "Correcte! 🎉 Nivell Mitjà!"; }
        else if (nivellActualJoc === 'mitja' && ++puntsNivellMitja === 4) { nivellActualJoc = 'dificil'; missatge = "Correcte! 🔥 Nivell Difícil!"; }
        mostrarResultat(true, missatge);
      } else {
        soError.play();
        mostrarResultat(false, `Incorrecte.<br><span class="resposta-correcta-error">${notesActuals.join(" ")}</span>`);
      }
      
      puntsEl.textContent = `Punts: ${punts}`;
      btnSeguent.disabled = false;
      bloquejarSiAcabat();
    }

    function mostrarResultat(correcte, missatge) {
      resultatEl.innerHTML = missatge;
      resultatEl.style.color = correcte ? "var(--accent-green)" : "var(--accent-pink)";
    }

    function bloquejarSiAcabat() {
      if (totalRespostes >= 10) {
        resumEl.textContent = `Test acabat! Has fet ${punts} punts de 10.`;
        btnSeguent.disabled = true;
        clearInterval(intervalId);
        tempsEl.textContent = "Fi";
      }
    }

    btnSeguent.addEventListener("click", nouAcord);
    window.onload = () => { soBenvinguda.play().catch(() => {}); nouAcord(); };
  </script>
</body>
</html>
